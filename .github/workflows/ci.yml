name: CI

# 平时提交的快速检查（语法 + 逻辑，不建包）。发版构建见 release.yml。
on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装最小依赖
        # 逻辑检查只用到 requests（翻译链的 ctranslate2/sherpa 等都是惰性导入）。
        # 这里刻意不装完整依赖：每次 push 拉 1GB 级 CUDA 轮子太慢，完整依赖由发版流水线验证。
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 回归检查（语法 + 逻辑）
        shell: bash
        env:
          PYTHONUTF8: "1"
        run: python tools/run_checks.py --no-gui
