name: Release

# 打 v* 标签即自动构建 exe 并发布 Release（含压缩包附件）；
# 也可在 Actions 页面手动触发（需已存在对应标签，仅用于重建）。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Prepare build env (import-order fix)
        shell: bash
        run: |
          SP=$(python -c "import sysconfig; print(sysconfig.get_paths()['purelib'])")
          cp tools/sitecustomize_pyi.py "$SP/sitecustomize.py"

      - name: Build exe
        env:
          PYI_SAFE_IMPORT: "1"
          PYTHONIOENCODING: utf-8
        run: python -m PyInstaller --noconfirm --clean subtitle.spec

      - name: Verify build output
        shell: bash
        run: |
          test -f "dist/实时翻译字幕/实时翻译字幕.exe"
          ls -lh "dist/实时翻译字幕/实时翻译字幕.exe"

      # 一次构建、派生两份产物：CPU 包（默认，无 CUDA 运行库）与 CUDA 完整包。
      # 脚本会校验"CPU 清单 ⊆ CUDA 清单、公共文件逐字节相同"，不通过就退出 1 → 整体不发版。
      - name: Package both flavors (CPU / CUDA)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          PYTHONIOENCODING: utf-8
        run: python tools/package_release.py --tag "${{ github.ref_name }}" --out .

      - name: Extract release notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: python tools/extract_notes.py "${{ github.ref_name }}" notes.md

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: notes.md
          files: |
            realtime-translate-subtitles-${{ github.ref_name }}-windows-x64.zip
            realtime-translate-subtitles-${{ github.ref_name }}-windows-x64-cuda.zip
